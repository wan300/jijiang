services:
  mysql:
    image: mysql:8.0
    container_name: jijiang-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: jijiang
      MYSQL_USER: ${DB_USERNAME:-jijiang}
      MYSQL_PASSWORD: ${DB_PASSWORD:-jijiang}
      TZ: Asia/Shanghai
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --ngram_token_size=2
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql

  redis:
    image: redis:7.2-alpine
    container_name: jijiang-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis} --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data

  backend:
    build:
      context: ./jijiang-backend
    container_name: jijiang-backend
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/jijiang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-jijiang}
      DB_PASSWORD: ${DB_PASSWORD:-jijiang}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./jijiang-miniapp
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
    container_name: jijiang-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
