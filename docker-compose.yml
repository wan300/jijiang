services:
  mysql:
    image: mysql:8.0
    container_name: jijiang-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: jijiang
      MYSQL_USER: ${DB_USERNAME:-jijiang}
      MYSQL_PASSWORD: ${DB_PASSWORD:-jijiang}
      TZ: Asia/Shanghai
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --ngram_token_size=2
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql

  redis:
    image: redis:7.2-alpine
    container_name: jijiang-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis} --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data

  backend:
    build:
      context: ./jijiang-backend
    container_name: jijiang-backend
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - payment-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/jijiang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-jijiang}
      DB_PASSWORD: ${DB_PASSWORD:-jijiang}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required for prod backend}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required for prod backend}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-JiJiang Admin}
      PAYMENT_SERVER_BASE_URL: http://payment-server:6670
      PAYMENT_SERVER_CLIENT_ID: ${PAYMENT_SERVER_CLIENT_ID:-jijiang-app}
      PAYMENT_SERVER_SHARED_SECRET: ${PAYMENT_SERVER_SHARED_SECRET:-dev-payment-secret-change-me}
    ports:
      - "8080:8080"

  payment-server:
    build:
      context: ./jijiang-payment-server
    container_name: jijiang-payment-server
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PAYMENT_DB_URL: jdbc:mysql://mysql:3306/jijiang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      PAYMENT_DB_USERNAME: ${DB_USERNAME:-jijiang}
      PAYMENT_DB_PASSWORD: ${DB_PASSWORD:-jijiang}
      PAYMENT_SERVER_PORT: 6670
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
      XUNHU_APP_ID: ${XUNHU_APP_ID:-}
      XUNHU_APP_SECRET: ${XUNHU_APP_SECRET:-}
      XUNHU_GATEWAY: ${XUNHU_GATEWAY:-https://api.xunhupay.com/payment/do.html}
      XUNHU_NOTIFY_URL: ${XUNHU_NOTIFY_URL:-}
      XUNHU_RETURN_URL: ${XUNHU_RETURN_URL:-}
      XUNHU_CALLBACK_URL: ${XUNHU_CALLBACK_URL:-}
      APP_SERVER_CALLBACK_URL: http://backend:8080/internal/payment/callback
      APP_SERVER_CLIENT_ID: ${APP_SERVER_CLIENT_ID:-jijiang-app}
      APP_SERVER_SHARED_SECRET: ${APP_SERVER_SHARED_SECRET:-dev-payment-secret-change-me}
    ports:
      - "6670:6670"

  frontend:
    build:
      context: ./jijiang-miniapp
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
    container_name: jijiang-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  admin:
    build:
      context: ./jijiang-backend/jijiang-admin
      args:
        VITE_API_BASE: ${ADMIN_VITE_API_BASE:-}
    container_name: jijiang-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8088:80"
