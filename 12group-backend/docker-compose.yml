name: ${COMPOSE_PROJECT_NAME:-jijiang-backend}

services:
  mysql:
    image: mysql:8.0
    profiles:
      - local-infra
    container_name: ${MYSQL_CONTAINER_NAME:-jijiang-backend-mysql}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root-password}
      MYSQL_DATABASE: ${DB_NAME:-jijiang}
      MYSQL_USER: ${DB_USERNAME:-jijiang}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --ngram_token_size=2
    ports:
      - "${DB_BIND_HOST:-127.0.0.1}:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    profiles:
      - local-infra
    container_name: ${REDIS_CONTAINER_NAME:-jijiang-backend-redis}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis-password}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-change-me-redis-password}
      - --appendonly
      - "yes"
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_BIND_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
    container_name: ${BACKEND_CONTAINER_NAME:-jijiang-backend}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${BACKEND_SPRING_PROFILES_ACTIVE:-shared-db}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin-password}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-JiJiang Admin}
      PAYMENT_SERVER_BASE_URL: ${PAYMENT_SERVER_BASE_URL:-}
      PAYMENT_SERVER_CLIENT_ID: ${PAYMENT_SERVER_CLIENT_ID:-jijiang-app}
      PAYMENT_SERVER_SHARED_SECRET: ${PAYMENT_SERVER_SHARED_SECRET:-}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  admin:
    build:
      context: ./jijiang-admin
      args:
        VITE_API_BASE: ${ADMIN_VITE_API_BASE:-}
    container_name: ${ADMIN_CONTAINER_NAME:-jijiang-admin}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${ADMIN_PORT:-8088}:80"

volumes:
  mysql-data:
  redis-data:
