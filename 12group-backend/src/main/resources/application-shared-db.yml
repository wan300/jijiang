spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/jijiang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:jijiang}
    password: ${DB_PASSWORD:jijiang}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis}

jijiang:
  payment-server:
    base-url: ${PAYMENT_SERVER_BASE_URL:http://localhost:6670}
    client-id: ${PAYMENT_SERVER_CLIENT_ID:jijiang-app}
    shared-secret: ${PAYMENT_SERVER_SHARED_SECRET:dev-payment-secret-change-me}
