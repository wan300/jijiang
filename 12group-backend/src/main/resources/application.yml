server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: jijiang-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

jijiang:
  wx:
    app-id: ${WX_APP_ID:}
    app-secret: ${WX_APP_SECRET:}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me}
    access-token-ttl-seconds: 7200
    admin-token-ttl-seconds: 7200
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@123456}
    display-name: ${ADMIN_DISPLAY_NAME:平台管理员}
  payment-server:
    base-url: ${PAYMENT_SERVER_BASE_URL:}
    client-id: ${PAYMENT_SERVER_CLIENT_ID:jijiang-app}
    shared-secret: ${PAYMENT_SERVER_SHARED_SECRET:}
  encryption:
    key: ${ENCRYPTION_KEY:}
    pepper: ${ENCRYPTION_PEPPER:}
  cos:
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-guangzhou}
    bucket: ${COS_BUCKET:}
    upload-expire-seconds: 300
  ocr:
    secret-id: ${OCR_SECRET_ID:}
    secret-key: ${OCR_SECRET_KEY:}
    region: ${OCR_REGION:ap-guangzhou}
  deposit:
    amount: 500.00
  deletion:
    cooling-days: 7
    cron: "0 0 2 * * *"
  rate-limit:
    enabled: true
    default-max-requests: 60
    default-window-seconds: 60
