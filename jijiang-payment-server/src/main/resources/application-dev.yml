spring:
  datasource:
    url: jdbc:h2:mem:jijiang_payment;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jijiang:
  app-server:
    callback-url: ${APP_SERVER_CALLBACK_URL:http://localhost:8080/internal/payment/callback}
    client-id: ${APP_SERVER_CLIENT_ID:jijiang-app}
    shared-secret: ${APP_SERVER_SHARED_SECRET:dev-payment-secret-change-me}
