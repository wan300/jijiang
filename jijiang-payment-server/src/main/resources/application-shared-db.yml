spring:
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:mysql://127.0.0.1:3306/jijiang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${PAYMENT_DB_USERNAME:${DB_USERNAME:jijiang}}
    password: ${PAYMENT_DB_PASSWORD:${DB_PASSWORD:jijiang}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${PAYMENT_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:5}}
      minimum-idle: ${PAYMENT_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:1}}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis}

jijiang:
  app-server:
    callback-url: ${APP_SERVER_CALLBACK_URL:http://localhost:8080/internal/payment/callback}
    client-id: ${APP_SERVER_CLIENT_ID:jijiang-app}
    shared-secret: ${APP_SERVER_SHARED_SECRET:dev-payment-secret-change-me}
