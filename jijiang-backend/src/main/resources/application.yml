server:
  port: 8080

spring:
  application:
    name: jijiang-backend
  profiles:
    active: dev
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

jijiang:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me}
    access-token-ttl-seconds: 7200
  mock:
    enabled: true
