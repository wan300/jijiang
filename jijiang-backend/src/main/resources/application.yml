server:
  port: 8080

spring:
  application:
    name: jijiang-backend
  profiles:
    active: dev
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

jijiang:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me}
    access-token-ttl-seconds: 7200
    admin-token-ttl-seconds: 7200
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@123456}
    display-name: ${ADMIN_DISPLAY_NAME:平台管理员}
  payment-server:
    base-url: ${PAYMENT_SERVER_BASE_URL:}
    client-id: ${PAYMENT_SERVER_CLIENT_ID:jijiang-app}
    shared-secret: ${PAYMENT_SERVER_SHARED_SECRET:}
